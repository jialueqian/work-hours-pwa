<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d0c">
  <meta name="slr-version" content="v33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="记工时">
  <meta name="format-detection" content="telephone=no">
  <title>记工时</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1179x2556.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>
  <div id="app">
    <main id="main">
      <section id="view-landing" class="view"></section>
      <section id="view-calendar" class="view active"></section>
      <section id="view-stats" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
    <div id="install-bar" hidden>
    <span id="install-bar-text"></span>
    <button id="install-bar-btn" hidden>安装</button>
    <button id="install-bar-close" aria-label="关闭">×</button>
  </div>
  <!-- 托管标占位：部署平台脚本检测到该 id 即跳过注入右下角悬浮徽标（防误触底栏），署名保留在设置页「关于」 -->
  <div id="zcode-site-badge" hidden></div>
  <script nomodule>
    // 仅在不支持 ES Modules 的老内核执行（Chromium <61）：给出可理解的提示而不是白屏
    document.addEventListener('DOMContentLoaded', function () {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#c46262;color:#fff;padding:10px 14px;font-size:14px;line-height:1.5;';
      d.textContent = '当前浏览器版本过旧，无法使用记工时。请更新浏览器，或改用系统自带浏览器 / Chrome 打开。';
      if (document.body) document.body.appendChild(d);
    });
  </script>
  <nav id="bottom-nav">
      <!-- 图标：Tabler Icons（MIT）风格的本地自绘 outline SVG -->
      <button class="nav-btn active" data-view="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        <span>工时</span>
      </button>
      <button class="nav-btn" data-view="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20v-6M10 20V8M16 20v-9M3 20h18"/></svg>
        <span>统计</span>
      </button>
      <button class="nav-btn" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="15" cy="7" r="2.2" fill="currentColor" stroke="none"/><circle cx="8" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="17" cy="17" r="2.2" fill="currentColor" stroke="none"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>
  <dialog id="punch-dialog"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
